name: Cleanup merged branches

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cleanup-merged-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/cleanup-merged-branches
          fetch-depth: 0
      - name: Delete merged work branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/w0-source-manifest-privacy'
            'agent/w0-claims-primary-sources'
            'agent/cur-curriculum-traceability'
            'agent/complete-wave-0-gate-a'
            'agent/framework-foundation'
            'agent/framework-data-measurement'
            'agent/framework-orchestration-runtime'
            'agent/sql-server-runtime-matrix'
            'agent/gate-b-pilot-demos'
            'agent/w2-007-refine-claims'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done
          git push origin --delete 'agent/cleanup-merged-branches'
