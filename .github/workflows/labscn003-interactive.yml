name: LABSCN-003 interactive contract

on:
  pull_request:
    paths:
      - 'Tools/PerformanceTrainingScenario/**'
      - 'Scenarios/CON-004/**'
      - 'Scenarios/CON-006/**'
      - 'Scenarios/DGN-005/**'
      - 'Tests/Lab/Invoke-PerformanceTrainingScenarioLifecycleTest.ps1'
      - 'Documentation/HowTo/CON_004_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/CON_006_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/DGN_005_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/INTERACTIVE_SCENARIO_LIFECYCLE.md'
      - 'Documentation/HowTo/CONTAINER_QUICKSTART.md'
      - 'Tests/Static/validate_labscn003_interactive.py'
      - 'Tests/Static/validate_labscn004_inf002003.py'
      - 'Tests/Static/validate_labscn005_dgn005.py'
      - 'Tests/Static/validate_labscn005_con006.py'
      - '.github/workflows/labscn003-interactive.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/PerformanceTrainingScenario/**'
      - 'Scenarios/CON-004/**'
      - 'Scenarios/CON-006/**'
      - 'Scenarios/DGN-005/**'
      - 'Tests/Lab/Invoke-PerformanceTrainingScenarioLifecycleTest.ps1'
      - 'Documentation/HowTo/CON_004_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/CON_006_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/DGN_005_INTERACTIVE_SCENARIO.md'
      - 'Documentation/HowTo/INTERACTIVE_SCENARIO_LIFECYCLE.md'
      - 'Documentation/HowTo/CONTAINER_QUICKSTART.md'
      - 'Tests/Static/validate_labscn003_interactive.py'
      - 'Tests/Static/validate_labscn004_inf002003.py'
      - 'Tests/Static/validate_labscn005_dgn005.py'
      - 'Tests/Static/validate_labscn005_con006.py'
      - '.github/workflows/labscn003-interactive.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate interactive lifecycle
        shell: pwsh
        run: |
          Import-Module ./Tools/PerformanceTrainingScenario/PerformanceTrainingScenario.psd1 -Force
          $commands = Get-Command -Module PerformanceTrainingScenario
          if ($commands.Count -ne 4) { throw "Expected four exported commands, got $($commands.Count)." }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./Tests/Lab/Invoke-PerformanceTrainingScenarioLifecycleTest.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - run: python Tests/Static/validate_labscn003_interactive.py
      - run: python Tests/Static/validate_labscn004_inf002003.py
      - run: python Tests/Static/validate_labscn005_dgn005.py
      - run: python Tests/Static/validate_labscn005_con006.py
      - run: python Tests/Static/validate_performance_scenarios.py
      - run: python Tests/Static/validate_privacy_metadata.py .
