name: DGN-007 Gewählte Profilaufnahme

on:
  pull_request:
    paths:
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Documentation/Project_Planning/DGN_007_SELECTED_PROFILE_OBSERVATION_REVIEW.md'
      - '.github/workflows/dgn007-selected-observation.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Documentation/Project_Planning/DGN_007_SELECTED_PROFILE_OBSERVATION_REVIEW.md'
      - '.github/workflows/dgn007-selected-observation.yml'

permissions:
  contents: read

concurrency:
  group: dgn007-selected-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-observation:
    name: DGN-007 Gewählte Anker und frische lokale Aufnahme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vollständige Aufnahme und dominante POSTs im eigenen Modell prüfen
        run: python -I -S -B Tests/Static/test_dgn007_selected_observation.py
