name: Framework contracts

on:
  pull_request:
    paths:
      - 'Demos/00_Framework/**'
      - 'Tests/Fixtures/DGN004_SourcePair/**'
      - 'Tests/Static/dgn004_plan_transport.py'
      - 'Tests/Static/dgn004_plan_frame.py'
      - 'Tests/Static/dgn004_capture_result.py'
      - 'Tests/Static/dgn004_capture_input.py'
      - 'Tests/Static/test_dgn004_source_pair.py'
      - 'Tests/Static/test_dgn004_plan_transport.py'
      - 'Tests/Static/test_dgn004_plan_frame.py'
      - 'Tests/Static/test_dgn004_capture_result.py'
      - 'Tests/Static/test_dgn004_capture_input.py'
      - '.ai/identity/registry.json'
      - 'Tests/Static/validate_framework_contracts.py'
      - 'Tests/Static/test_result_contract_evaluator.py'
      - 'Tests/Static/validate_orchestration_runtime.py'
      - 'Tests/Static/test_orchestration_runtime.py'
      - 'Tests/Static/validate_w2_002_dependency_neutralization.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Documentation/Inventories/legacy_example_classification.json'
      - 'Documentation/Inventories/w2_002_dependency_neutralization.json'
      - 'Documentation/Project_Planning/W2_002_DEPENDENCY_NEUTRALIZATION_REVIEW.md'
      - '.github/workflows/framework-contracts.yml'
      - '.ai/DEMO_CONTRACT.md'
  push:
    branches:
      - main
    paths:
      - 'Demos/00_Framework/**'
      - 'Tests/Fixtures/DGN004_SourcePair/**'
      - 'Tests/Static/dgn004_plan_transport.py'
      - 'Tests/Static/dgn004_plan_frame.py'
      - 'Tests/Static/dgn004_capture_result.py'
      - 'Tests/Static/dgn004_capture_input.py'
      - 'Tests/Static/test_dgn004_source_pair.py'
      - 'Tests/Static/test_dgn004_plan_transport.py'
      - 'Tests/Static/test_dgn004_plan_frame.py'
      - 'Tests/Static/test_dgn004_capture_result.py'
      - 'Tests/Static/test_dgn004_capture_input.py'
      - '.ai/identity/registry.json'
      - 'Tests/Static/validate_framework_contracts.py'
      - 'Tests/Static/test_result_contract_evaluator.py'
      - 'Tests/Static/validate_orchestration_runtime.py'
      - 'Tests/Static/test_orchestration_runtime.py'
      - 'Tests/Static/validate_w2_002_dependency_neutralization.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Documentation/Inventories/legacy_example_classification.json'
      - 'Documentation/Inventories/w2_002_dependency_neutralization.json'
      - 'Documentation/Project_Planning/W2_002_DEPENDENCY_NEUTRALIZATION_REVIEW.md'
      - '.github/workflows/framework-contracts.yml'
      - '.ai/DEMO_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate framework contracts
        run: python Tests/Static/validate_framework_contracts.py

      - name: Test DGN-004 source pair
        run: python Tests/Static/test_dgn004_source_pair.py

      - name: Test DGN-004 plan transport
        run: python Tests/Static/test_dgn004_plan_transport.py

      - name: Test DGN-004 plan frame
        run: python Tests/Static/test_dgn004_plan_frame.py

      - name: Test DGN-004 capture result
        run: python Tests/Static/test_dgn004_capture_result.py

      - name: Test DGN-004 capture input
        run: python Tests/Static/test_dgn004_capture_input.py

      - name: Test result contract evaluator
        run: python Tests/Static/test_result_contract_evaluator.py

      - name: Validate orchestration and runtime contracts
        run: python Tests/Static/validate_orchestration_runtime.py

      - name: Test orchestration and runtime harness
        run: python Tests/Static/test_orchestration_runtime.py

      - name: Validate W2-002 dependency neutralization
        run: python Tests/Static/validate_w2_002_dependency_neutralization.py
