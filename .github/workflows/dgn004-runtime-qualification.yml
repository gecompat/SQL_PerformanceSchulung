name: DGN-004 bounded runtime qualification

on:
  pull_request:
    paths:
      - 'Tests/Fixtures/DGN004_SourcePair/**'
      - 'Tests/Runtime/dgn004_*.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Static/dgn004_*.py'
      - 'Tests/Static/test_dgn004_*.py'
      - 'Tests/Static/validate_dgn004_runtime_workflow.py'
      - 'Tests/Static/test_validate_dgn004_runtime_workflow.py'
      - '.github/workflows/dgn004-runtime-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Fixtures/DGN004_SourcePair/**'
      - 'Tests/Runtime/dgn004_*.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Static/dgn004_*.py'
      - 'Tests/Static/test_dgn004_*.py'
      - 'Tests/Static/validate_dgn004_runtime_workflow.py'
      - 'Tests/Static/test_validate_dgn004_runtime_workflow.py'
      - '.github/workflows/dgn004-runtime-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dgn004-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate bounded qualification workflow
        run: python Tests/Static/validate_dgn004_runtime_workflow.py
      - name: Test bounded qualification workflow
        run: python Tests/Static/test_validate_dgn004_runtime_workflow.py
      - name: Test DGN-004 runtime runner
        run: python -m unittest Tests.Static.test_dgn004_runtime_runner

  qualification:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - build: '2022'
            image: 'mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89'
          - build: '2025'
            image: 'mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pull exact SQL Server image
        env:
          SQL_IMAGE: ${{ matrix.image }}
        run: docker pull "$SQL_IMAGE"
      - name: Run one bounded qualification attempt
        env:
          BUILD: ${{ matrix.build }}
        shell: bash
        run: |
          set -euo pipefail
          python Tests/Runtime/dgn004_runtime_runner.py --build "$BUILD" 2>&1 \
            | tee "$RUNNER_TEMP/dgn004-${BUILD}-qualification.log"
      - name: Preserve bounded diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgn004-${{ matrix.build }}-qualification
          path: ${{ runner.temp }}/dgn004-${{ matrix.build }}-qualification.log
          if-no-files-found: ignore
          retention-days: 3
