name: Export W2-001 reference archive

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-w2-001-reference.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Upload neutralized reference archive
        uses: actions/upload-artifact@v4
        with:
          name: w2-001-reference-archive
          path: Presentations/old/Performance Grundlagen V-2024.zip
          if-no-files-found: error
          retention-days: 1
