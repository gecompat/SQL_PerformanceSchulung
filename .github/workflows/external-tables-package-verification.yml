      - 'Tests/Static/test_external_tables_hyperv_network.ps1'
      - 'Tests/Runtime/Test-ExternalTablesHyperVAbsence.ps1'
      - 'Tests/Runtime/Remove-ExternalTablesHyperVOwnedRun.ps1'
      - 'Tests/Runtime/New-ExternalTablesHyperVDetachedRun.ps1'
      - 'Tests/Runtime/Start-ExternalTablesHyperVOwnedRun.ps1'
