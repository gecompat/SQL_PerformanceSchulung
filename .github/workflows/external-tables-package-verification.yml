name: External Tables package verification

on:
  pull_request:
    paths:
      - 'Tests/Static/verify_external_tables_packages.py'
      - 'Tests/Static/test_external_tables_packages.py'
      - 'Tests/Static/inspect_external_tables_driver.py'
      - 'Tests/Static/test_external_tables_driver.py'
      - 'Tests/Static/verify_external_tables_ubuntu_base.py'
      - 'Tests/Static/test_external_tables_ubuntu_base.py'
      - 'Documentation/Project_Planning/external_tables_vhdx_evidence.json'
      - 'Tests/Static/verify_external_tables_apt_plan.py'
      - 'Tests/Static/test_external_tables_apt_plan.py'
      - 'Tests/Runtime/external_tables_pilot_sql.py'
      - 'Tests/Runtime/external_tables_pushdown_evidence.py'
      - 'Tests/Runtime/external_tables_measurement.py'
      - 'Tests/Runtime/external_tables_odbc.py'
      - 'Tests/Static/test_external_tables_odbc.py'
      - 'Tests/Static/test_external_tables_measurement.py'
      - 'Tests/Static/test_external_tables_pushdown_evidence.py'
      - 'Tests/Static/test_external_tables_pilot_sql.py'
      - 'Documentation/Project_Planning/external_tables_apt_lock.json'
      - '.github/workflows/external-tables-package-verification.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Static/verify_external_tables_packages.py'
      - 'Tests/Static/test_external_tables_packages.py'
      - 'Tests/Static/inspect_external_tables_driver.py'
      - 'Tests/Static/test_external_tables_driver.py'
      - 'Tests/Static/verify_external_tables_ubuntu_base.py'
      - 'Tests/Static/test_external_tables_ubuntu_base.py'
      - 'Documentation/Project_Planning/external_tables_vhdx_evidence.json'
      - 'Tests/Static/verify_external_tables_apt_plan.py'
      - 'Tests/Static/test_external_tables_apt_plan.py'
      - 'Tests/Runtime/external_tables_pilot_sql.py'
      - 'Tests/Runtime/external_tables_pushdown_evidence.py'
      - 'Tests/Runtime/external_tables_measurement.py'
      - 'Tests/Runtime/external_tables_odbc.py'
      - 'Tests/Static/test_external_tables_odbc.py'
      - 'Tests/Static/test_external_tables_measurement.py'
      - 'Tests/Static/test_external_tables_pushdown_evidence.py'
      - 'Tests/Static/test_external_tables_pilot_sql.py'
      - 'Documentation/Project_Planning/external_tables_apt_lock.json'
      - '.github/workflows/external-tables-package-verification.yml'

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python Tests/Static/test_external_tables_packages.py
      - run: python Tests/Static/test_external_tables_driver.py
      - run: python Tests/Static/test_external_tables_ubuntu_base.py
      - run: python Tests/Static/test_external_tables_apt_plan.py
      - run: python Tests/Static/test_external_tables_pilot_sql.py
      - run: python Tests/Static/test_external_tables_pushdown_evidence.py
      - run: python Tests/Static/test_external_tables_measurement.py
      - run: python Tests/Static/test_external_tables_odbc.py
