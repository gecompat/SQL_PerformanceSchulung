      - '.github/workflows/external-tables-package-verification.yml'

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python Tests/Static/test_external_tables_packages.py
      - run: python Tests/Static/test_external_tables_driver.py
      - run: python Tests/Static/test_external_tables_ubuntu_base.py
      - run: python Tests/Static/test_external_tables_apt_plan.py
      - run: python Tests/Static/test_external_tables_pilot_sql.py
      - run: python Tests/Static/test_external_tables_pushdown_evidence.py
      - run: python Tests/Static/test_external_tables_measurement.py
      - run: python Tests/Static/test_external_tables_odbc.py
      - run: python Tests/Static/test_external_tables_principals.py
      - run: python Tests/Static/test_external_tables_cleanup.py
      - run: python Tests/Static/test_external_tables_pilot.py
      - run: python Tests/Static/test_external_tables_guest_identity.py
      - run: python Tests/Static/test_external_tables_guest_admin.py
      - run: python Tests/Static/test_external_tables_guest_service.py
      - run: python Tests/Static/test_external_tables_guest_bootstrap.py
      - run: python Tests/Static/test_external_tables_hyperv_host.py
      - run: python Tests/Static/test_external_tables_guest_network.py
      - run: |
          ./Tests/Static/test_external_tables_hyperv_network.ps1
          ./Tests/Static/test_external_tables_hyperv_absence.ps1
          ./Tests/Static/test_external_tables_hyperv_teardown.ps1
          ./Tests/Static/test_external_tables_hyperv_provision.ps1
          ./Tests/Static/test_external_tables_hyperv_boot.ps1
          ./Tests/Static/test_external_tables_hyperv_resources.ps1
        shell: pwsh
      - run: python Tests/Static/test_external_tables_source_firewall.py
      - run: python Tests/Static/test_external_tables_tls_material.py
