name: Apply W2-001 classification

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp/w2-001/**'
      - '.github/workflows/apply-w2-001.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/w2-001-example-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: agent/w2-001-example-classification
          fetch-depth: 0
      - name: Apply and validate classification payload
        shell: bash
        run: |
          exec > >(tee /tmp/w2-001-apply.log) 2>&1
          set -euo pipefail
          cat .tmp/w2-001/part*.b64 > /tmp/w2-001-payload.b64
          base64 --decode /tmp/w2-001-payload.b64 > /tmp/w2-001-payload.zip
          unzip -t /tmp/w2-001-payload.zip
          rm -rf /tmp/w2-001-payload
          mkdir -p /tmp/w2-001-payload
          unzip -q /tmp/w2-001-payload.zip -d /tmp/w2-001-payload
          cp -a /tmp/w2-001-payload/repo/. ./
          python Tests/Static/validate_w2_001_classification.py
          rm -rf .tmp/w2-001
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'W2-001: Bestandsbeispiele vollständig klassifizieren'
          git push origin HEAD:agent/w2-001-example-classification
      - name: Upload apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-001-apply-diagnostic
          path: /tmp/w2-001-apply.log
          if-no-files-found: warn
          retention-days: 1
