name: Apply W2-007 working set

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-active-deck.yml'
      - '.tmp/w2-007/**'
      - 'Presentations/Performance_Schulung_Chat_2026-07-23_2146_SQL_Server_Performance_Grundlagen.pptx'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/w2-007-refine-claims'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: agent/w2-007-refine-claims
          fetch-depth: 0
      - name: Apply and validate W2-007 payload
        shell: bash
        run: |
          exec > >(tee /tmp/w2-007-apply.log) 2>&1
          set -euo pipefail
          test -f .tmp/w2-007/payload-complete.txt
          cat .tmp/w2-007/part*.b64 > /tmp/w2-007-payload.b64
          base64 --decode /tmp/w2-007-payload.b64 > /tmp/w2-007-payload.zip
          unzip -t /tmp/w2-007-payload.zip
          rm -rf /tmp/w2-007-payload
          mkdir -p /tmp/w2-007-payload
          unzip -q /tmp/w2-007-payload.zip -d /tmp/w2-007-payload
          cp -a /tmp/w2-007-payload/repo/. ./
          python - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          deck = Path('Presentations/Performance_Schulung_Chat_2026-07-23_2146_SQL_Server_Performance_Grundlagen.pptx')
          replacements_root = Path('/tmp/w2-007-payload/xml')
          replacements = {
              path.relative_to(replacements_root).as_posix(): path.read_bytes()
              for path in replacements_root.rglob('*.xml')
          }
          print(f'OOXML replacements: {len(replacements)}')
          temporary = deck.with_suffix('.w2-007.tmp.pptx')
          with zipfile.ZipFile(deck, 'r') as source, zipfile.ZipFile(temporary, 'w') as target:
              for info in source.infolist():
                  data = replacements.get(info.filename, source.read(info.filename))
                  target.writestr(info, data)
          os.replace(temporary, deck)
          PY
          DECK_SHA=$(sha256sum Presentations/Performance_Schulung_Chat_2026-07-23_2146_SQL_Server_Performance_Grundlagen.pptx | awk '{print $1}')
          python - "$DECK_SHA" <<'PY'
          from pathlib import Path
          import sys

          old = '38d91cb92b4e38de8a3878c0f4c9669f0fa65405abdc486a323b278c7ff3cd88'
          new = sys.argv[1]
          for filename in (
              'Documentation/Inventories/SLIDE_STATEMENT_REGISTER.md',
              'Documentation/Project_Planning/W2_007_REFINE_CLAIMS_REVIEW.md',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source hash missing in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Deck SHA-256 synchronized: {new}')
          PY
          python Tests/Static/validate_w2_007_presentation.py
          rm -rf .tmp/w2-007
          rm -f .github/workflows/apply-w2-007.yml
          rm -f .github/workflows/export-active-deck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'W2-007: REFINE-Claims fachlich korrigieren und validieren'
          git push origin HEAD:agent/w2-007-refine-claims
      - name: Upload W2-007 apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-007-apply-diagnostic
          path: /tmp/w2-007-apply.log
          if-no-files-found: warn
          retention-days: 1
