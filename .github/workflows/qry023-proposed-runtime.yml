name: QRY-023 proposed isolated runtime

on:
  pull_request:
    paths:
      - 'Demos/05_Query_Patterns/QRY-023_Graph_Tables/**'
      - 'Demos/00_Framework/Tools/run_demo.py'
      - 'Demos/00_Framework/Tools/sqlcmd_process.py'
      - 'Tests/Runtime/provision_qry023_reader_login.py'
      - 'Tests/Runtime/qry023_*'
      - 'Tests/Static/*qry023*'
      - '.github/workflows/qry023-proposed-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'Demos/05_Query_Patterns/QRY-023_Graph_Tables/**'
      - 'Demos/00_Framework/Tools/run_demo.py'
      - 'Demos/00_Framework/Tools/sqlcmd_process.py'
      - 'Tests/Runtime/provision_qry023_reader_login.py'
      - 'Tests/Runtime/qry023_*'
      - 'Tests/Static/*qry023*'
      - '.github/workflows/qry023-proposed-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qry023-proposed-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate isolated caller and resource guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python Tests/Static/test_qry023_runtime_caller.py
      - run: python Tests/Static/validate_qry023_proposed_harness.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Tests/Static/Qry023SqlParser/Qry023SqlParser.csproj --locked-mode
      - run: dotnet run --project Tests/Static/Qry023SqlParser/Qry023SqlParser.csproj --configuration Release --no-restore

  runtime:
    name: SQL Server ${{ matrix.year }} isolated QRY-023
    needs: static
    # GitHub-hosted gives each matrix job a dedicated ephemeral VM; the resource
    # floor is not safe on an arbitrarily shared self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2019
            major: 15
            image: mcr.microsoft.com/mssql/server@sha256:07d7dedecdbfcf6776035dc5eefb5bfd9aa1804b2f6b99f7dedb397d8a599069
          - year: 2022
            major: 16
            image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          - year: 2025
            major: 17
            image: mcr.microsoft.com/mssql/server@sha256:6972fb831759433def6a34e107fa32a85230bff5af8014c6263fe4633ea9cc0f
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check host resource floor
        shell: bash
        run: |
          set -euo pipefail
          cpu_count="$(nproc)"
          memory_mib="$(awk '/MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)"
          free_disk_mib="$(df -Pm "$GITHUB_WORKSPACE" | awk 'END {print $4}')"
          if (( cpu_count < 2 || memory_mib < 8192 || free_disk_mib < 20480 )); then
            echo "Host is below the proposed QRY-023 floor: cpu=${cpu_count}, available_memory_mib=${memory_mib}, free_disk_mib=${free_disk_mib}." >&2
            exit 1
          fi
      - name: Start pinned, resource-bounded SQL Server
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          password="Qry023!${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}${{ matrix.major }}Admin"
          reader_password="QRY023!${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}${{ matrix.major }}Read$(openssl rand -hex 16)"
          container="sqlperf-qry023-${{ matrix.major }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner="$(openssl rand -hex 16)"
          env_file="$RUNNER_TEMP/qry023-env-${{ matrix.major }}-${GITHUB_RUN_ID}.txt"
          echo "::add-mask::${password}"
          echo "::add-mask::${reader_password}"
          echo "SQLPERF_SQL_CONTAINER=${container}" >> "$GITHUB_ENV"
          echo "SQLPERF_CI_OWNER=${owner}" >> "$GITHUB_ENV"
          echo "SQLPERF_SQL_USERNAME_ADMIN=sa" >> "$GITHUB_ENV"
          echo "SQLPERF_SQL_USERNAME_READER=READER" >> "$GITHUB_ENV"
          echo "SQLPERF_SQL_PASSWORD_ADMIN=${password}" >> "$GITHUB_ENV"
          echo "SQLPERF_SQL_PASSWORD_READER=${reader_password}" >> "$GITHUB_ENV"
          echo "SQLCMDPASSWORD=${password}" >> "$GITHUB_ENV"
          docker pull '${{ matrix.image }}'
          umask 077
          printf 'ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_MEMORY_LIMIT_MB=3072\nMSSQL_SA_PASSWORD=%s\n' "$password" > "$env_file"
          trap 'rm -f -- "$env_file"' EXIT
          docker run \
            --name "$container" \
            --label "sqlperf.ci.owner=${owner}" \
            --hostname "$container" \
            --cpus 2 --memory 4g \
            --env-file "$env_file" \
            -d '${{ matrix.image }}'
          rm -f -- "$env_file"
          trap - EXIT
          readback="$(docker inspect --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}} {{.Config.Image}}' "$container")"
          [[ "$readback" == "2000000000 4294967296 ${{ matrix.image }}" ]]
          ready=0
          for attempt in $(seq 1 90); do
            if docker logs "$container" 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              ready=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
              docker logs "$container" 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then docker logs "$container" 2>&1 || true; exit 1; fi
          sqlcmd="$(docker exec "$container" sh -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then printf /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then printf /opt/mssql-tools/bin/sqlcmd; else exit 127; fi')"
          login_ready=0
          for attempt in $(seq 1 90); do
            if docker exec -e SQLCMDPASSWORD "$container" "$sqlcmd" -S localhost -d master -U sa -C -b -Q 'SELECT 1;' >/dev/null 2>&1; then
              login_ready=1
              break
            fi
            sleep 2
          done
          [[ "$login_ready" == 1 ]]
      - name: Enforce TempDB growth ceiling before setup
        shell: bash
        run: |
          set -euo pipefail
          container="${SQLPERF_SQL_CONTAINER:?}"
          sqlcmd="$(docker exec "$container" sh -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then printf /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then printf /opt/mssql-tools/bin/sqlcmd; else exit 127; fi')"
          set +e
          output="$(docker exec -i -e SQLCMDPASSWORD "$container" "$sqlcmd" -S localhost -d master -U sa -C -b -r 1 < Tests/Runtime/qry023_tempdb_resource_guard.sql 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            docker exec -e SQLCMDPASSWORD "$container" "$sqlcmd" -S localhost -d master -U sa -C -Q \
              'SELECT file_id,type,size AS size_pages,max_size AS max_size_pages,growth,is_percent_growth FROM tempdb.sys.database_files ORDER BY file_id;'
            exit "$status"
          fi
          grep -F 'QRY023_TEMPDB_GUARD|PASS|' <<< "$output"
          grep -F ';growth_mib=64' <<< "$output"
      - name: Provision the fresh READER SQL login through stdin
        shell: bash
        run: python Tests/Runtime/provision_qry023_reader_login.py
      - name: Prove the permission inventory rejects an unexpected READER grant
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-negative-permission-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|EXTRA_GRANT_AND_ROLE_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'DATABASE_ROLE;' "$log"
          grep -F 'DATABASE_PERMISSION;' "$log"
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Negative permission case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Prove the permission inventory rejects an explicit READER DENY
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: DIRECT_DENY
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-deny-permission-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|DIRECT_DENY_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'DATABASE_PERMISSION;' "$log"
          if grep -F 'DATABASE_ROLE;' "$log"; then
            echo 'DENY case unexpectedly included a role mutation.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'DENY case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Prove the permission inventory rejects an unexpected READER server role
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: SERVER_ROLE
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-server-role-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          echo "QRY023_SERVER_ROLE_ATTEMPTED=1" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_ROLE_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'SERVER_ROLE;' "$log"
          if grep -F 'DATABASE_ROLE;' "$log" || grep -F 'DATABASE_PERMISSION;' "$log"; then
            echo 'Server-role case produced an unexpected database-permission category.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Server-role case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Restore server-role baseline after negative control
        if: always() && env.QRY023_SERVER_ROLE_ATTEMPTED == '1'
        shell: bash
        run: |
          set -euo pipefail
          container="${SQLPERF_SQL_CONTAINER:-}"
          owner="${SQLPERF_CI_OWNER:-}"
          if [[ -z "$container" || -z "$owner" ]]; then exit 0; fi
          container_id="$(docker inspect --format '{{.Id}}' "$container" 2>/dev/null || true)"
          if [[ -z "$container_id" ]]; then exit 0; fi
          [[ "$(docker inspect --format '{{ index .Config.Labels "sqlperf.ci.owner" }}' "$container_id")" == "$owner" ]]
          sqlcmd="$(docker exec "$container_id" sh -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then printf /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then printf /opt/mssql-tools/bin/sqlcmd; else exit 127; fi')"
          output="$(docker exec -e SQLCMDPASSWORD "$container_id" "$sqlcmd" -S localhost -d master -U sa -C -b -Q \
            "DECLARE @membership int=IS_SRVROLEMEMBER(N'dbcreator',N'READER'); IF @membership=1 BEGIN ALTER SERVER ROLE [dbcreator] DROP MEMBER [READER]; SET @membership=IS_SRVROLEMEMBER(N'dbcreator',N'READER'); END; IF @membership IS NULL OR @membership<>0 THROW 51024,'QRY-023 negative server-role cleanup failed.',1; PRINT 'QRY023_NEGATIVE_PERMISSION|SERVER_ROLE_RESTORED';")"
          printf '%s\n' "$output"
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_ROLE_RESTORED' <<< "$output"
          echo 'QRY023_SERVER_ROLE_ATTEMPTED=' >> "$GITHUB_ENV"
      - name: Prove the permission inventory rejects an unexpected READER server permission
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: SERVER_PERMISSION
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-server-permission-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          echo "QRY023_SERVER_PERMISSION_ATTEMPTED=1" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'SERVER_PERMISSION;' "$log"
          if grep -F 'SERVER_ROLE;' "$log" || grep -F 'DATABASE_PERMISSION;' "$log" || grep -F 'DATABASE_ROLE;' "$log"; then
            echo 'Server-permission case produced an unexpected permission category.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Server-permission case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Restore server-permission baseline after negative control
        if: always() && env.QRY023_SERVER_PERMISSION_ATTEMPTED == '1'
        shell: bash
        run: |
          set -euo pipefail
          container="${SQLPERF_SQL_CONTAINER:-}"
          owner="${SQLPERF_CI_OWNER:-}"
          if [[ -z "$container" || -z "$owner" ]]; then exit 0; fi
          container_id="$(docker inspect --format '{{.Id}}' "$container" 2>/dev/null || true)"
          if [[ -z "$container_id" ]]; then exit 0; fi
          [[ "$(docker inspect --format '{{ index .Config.Labels "sqlperf.ci.owner" }}' "$container_id")" == "$owner" ]]
          sqlcmd="$(docker exec "$container_id" sh -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then printf /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then printf /opt/mssql-tools/bin/sqlcmd; else exit 127; fi')"
          output="$(docker exec -e SQLCMDPASSWORD "$container_id" "$sqlcmd" -S localhost -d master -U sa -C -b -Q \
            "DECLARE @reader_id int=SUSER_ID(N'READER'); IF @reader_id IS NULL BEGIN PRINT 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_RESTORED'; RETURN; END; IF EXISTS (SELECT 1 FROM master.sys.server_permissions WHERE grantee_principal_id=@reader_id AND permission_name=N'VIEW SERVER STATE') REVOKE VIEW SERVER STATE FROM [READER]; IF EXISTS (SELECT 1 FROM master.sys.server_permissions WHERE grantee_principal_id=@reader_id AND permission_name=N'VIEW SERVER STATE') THROW 51025,'QRY-023 negative server-permission cleanup failed.',1; PRINT 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_RESTORED';")"
          printf '%s\n' "$output"
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_RESTORED' <<< "$output"
          echo 'QRY023_SERVER_PERMISSION_ATTEMPTED=' >> "$GITHUB_ENV"
      - name: Prove the permission inventory rejects a denied READER server permission
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: SERVER_PERMISSION_DENY
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-server-permission-deny-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          echo "QRY023_SERVER_PERMISSION_DENY_ATTEMPTED=1" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_DENY_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'SERVER_PERMISSION;' "$log"
          if grep -F 'SERVER_ROLE;' "$log" || grep -F 'DATABASE_PERMISSION;' "$log" || grep -F 'DATABASE_ROLE;' "$log"; then
            echo 'Denied server-permission case produced an unexpected permission category.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Denied server-permission case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Restore denied server-permission baseline after negative control
        if: always() && env.QRY023_SERVER_PERMISSION_DENY_ATTEMPTED == '1'
        shell: bash
        run: |
          set -euo pipefail
          container="${SQLPERF_SQL_CONTAINER:-}"
          owner="${SQLPERF_CI_OWNER:-}"
          if [[ -z "$container" || -z "$owner" ]]; then exit 0; fi
          container_id="$(docker inspect --format '{{.Id}}' "$container" 2>/dev/null || true)"
          if [[ -z "$container_id" ]]; then exit 0; fi
          [[ "$(docker inspect --format '{{ index .Config.Labels "sqlperf.ci.owner" }}' "$container_id")" == "$owner" ]]
          sqlcmd="$(docker exec "$container_id" sh -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then printf /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then printf /opt/mssql-tools/bin/sqlcmd; else exit 127; fi')"
          output="$(docker exec -e SQLCMDPASSWORD "$container_id" "$sqlcmd" -S localhost -d master -U sa -C -b -Q \
            "DECLARE @reader_id int=SUSER_ID(N'READER'); IF @reader_id IS NULL BEGIN PRINT 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_DENY_RESTORED'; RETURN; END; IF EXISTS (SELECT 1 FROM master.sys.server_permissions WHERE grantee_principal_id=@reader_id AND permission_name=N'VIEW SERVER STATE') REVOKE VIEW SERVER STATE FROM [READER]; IF EXISTS (SELECT 1 FROM master.sys.server_permissions WHERE grantee_principal_id=@reader_id AND permission_name=N'VIEW SERVER STATE') THROW 51026,'QRY-023 negative server-permission DENY cleanup failed.',1; PRINT 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_DENY_RESTORED';")"
          printf '%s\n' "$output"
          grep -F 'QRY023_NEGATIVE_PERMISSION|SERVER_PERMISSION_DENY_RESTORED' <<< "$output"
          echo 'QRY023_SERVER_PERMISSION_DENY_ATTEMPTED=' >> "$GITHUB_ENV"
      - name: Prove the permission inventory rejects an unexpected READER database permission
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: DATABASE_PERMISSION
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-database-permission-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|DATABASE_PERMISSION_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'DATABASE_PERMISSION;' "$log"
          if grep -F 'DATABASE_ROLE;' "$log" || grep -F 'SERVER_PERMISSION;' "$log" || grep -F 'SERVER_ROLE;' "$log"; then
            echo 'Database-permission case produced an unexpected permission category.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Database-permission case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Prove the permission inventory rejects a denied READER database permission
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: DATABASE_PERMISSION_DENY
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-database-permission-deny-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
          [[ "$result" == 2 ]]
          grep -F 'QRY023_NEGATIVE_PERMISSION|DATABASE_PERMISSION_DENY_INJECTED' "$log"
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_NOT_PROVEN' "$log"
          grep -F 'DATABASE_PERMISSION;' "$log"
          if grep -F 'DATABASE_ROLE;' "$log" || grep -F 'SERVER_PERMISSION;' "$log" || grep -F 'SERVER_ROLE;' "$log"; then
            echo 'Denied database-permission case produced an unexpected permission category.' >&2
            exit 1
          fi
          grep -F 'CLEANUP: PASS/OK' "$log"
          if grep -Eq '(CORRECTNESS|MEASUREMENT|PLAN_EVIDENCE): PASS/OK' "$log"; then
            echo 'Denied database-permission case reached a protected query phase.' >&2
            exit 1
          fi
      - name: Prove the permission inventory rejects an unexpected READER endpoint permission
        shell: bash
        env:
          SQLPERF_QRY023_NEGATIVE_PERMISSION_MODE: ENDPOINT_PERMISSION
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qry023-endpoint-permission-${{ matrix.major }}.log"
          echo "QRY023_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          echo 'QRY023_ENDPOINT_PERMISSION_GRANTED=0' >> "$GITHUB_ENV"
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            Demos/05_Query_Patterns/QRY-023_Graph_Tables/manifest.proposed.json \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_negative_permission_proxy.py \
            --confirm-isolated-lab --show-output 2>&1 | tee "$log"
          result="${PIPESTATUS[0]}"
          set -e
