            cat "$log" >&2 || true
            exit 1
          fi
          grep -F 'SQLPERF_SUMMARY|FAIL|FAIL_CLEANUP' "$log"
          grep -F 'PLAN_EVIDENCE: FAIL/FAIL_TIMEOUT' "$log"
          grep -F 'CLEANUP: FAIL/FAIL_CLEANUP' "$log"
          grep -F 'serverseitiges Ende und TempDB-Freigabe sind nicht bewiesen; SQL-Cleanup wurde unterdrückt.' "$log"
