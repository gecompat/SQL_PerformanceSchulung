            echo "Preserving owned container after an unproven QRY-023 cleanup: ${container}" >&2
            exit 0
          fi
          container_id="$(docker inspect --format '{{.Id}}' "$container" 2>/dev/null || true)"
          if [[ -z "$container_id" ]]; then exit 0; fi
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          actual_owner="$(docker inspect --format '{{ index .Config.Labels "sqlperf.ci.owner" }}' "$container_id")"
          [[ "$actual_owner" == "$owner" ]]
          docker rm --force --volumes "$container_id"
          remaining="$(docker container ls --all --quiet --filter "id=${container_id}")"
          [[ -z "$remaining" ]]
