            if active="$(docker exec -e SQLCMDPASSWORD "$container_id" "$sqlcmd" -S localhost -d master -U sa -C -b -h -1 -W -Q "$active_sql")"; then
              :
            else
              status=$?
              echo "QRY023_TIMEOUT_NEGATIVE|DMV_POLL_FAILED|attempt=${attempt}|status=${status}" >&2
              cat "$log" >&2 || true
              exit 1
            fi
            [[ "$active" == 1 ]] && break
            kill -0 "$runner_pid" 2>/dev/null || break
            sleep 0.2
          done
          echo "QRY023_TIMEOUT_NEGATIVE|DMV_POLL_RESULT|active=${active}|attempt=${attempt}"
          if [[ "$active" != 1 ]]; then
            echo 'QRY023_TIMEOUT_NEGATIVE|PROBE_REQUEST_NOT_OBSERVED' >&2
            cat "$log" >&2 || true
            exit 1
          fi
          set +e
          wait "$runner_pid"
          result=$?
          set -e
          echo "QRY023_TIMEOUT_NEGATIVE|RUNNER_EXIT|status=${result}"
