          output="$(docker exec -e SQLCMDPASSWORD "$container_id" "$sqlcmd" -S localhost -d master -U READER -C -b -Q "SET NOCOUNT ON; SELECT 'QRY023_READER_LOGIN_AFTER_CUSTOM_ENDPOINT|PASS';")"
