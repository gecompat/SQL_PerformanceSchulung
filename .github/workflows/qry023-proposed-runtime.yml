          echo "QRY023_TIMEOUT_HARNESS_LOG=${log}" >> "$GITHUB_ENV"
          python - "$demo_dir/manifest.proposed.json" "$timeout_manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          manifest = json.loads(source.read_text(encoding="utf-8"))
          manifest["phases"] = [
              phase for phase in manifest["phases"]
              if phase["id"] in {"PREFLIGHT", "SETUP", "PLAN_EVIDENCE"}
          ]
          plan = next(phase for phase in manifest["phases"] if phase["id"] == "PLAN_EVIDENCE")
          plan["timeout_seconds"] = 5
          plan["credential_profile"] = "ADMIN"
          plan["script"] = ".qry023_timeout_probe.sql"
          manifest["credential_profiles"] = ["ADMIN"]
          if [phase["id"] for phase in manifest["phases"]] != ["PREFLIGHT", "SETUP", "PLAN_EVIDENCE"]:
              raise SystemExit("timeout probe manifest did not retain its exact bounded phase sequence")
          (source.parent / plan["script"]).write_text(
              "SET NOCOUNT ON;\n"
              "RAISERROR('QRY023_TIMEOUT_PROBE|STARTED',10,1) WITH NOWAIT;\n"
              "WAITFOR DELAY '00:00:30';\n"
              "PRINT 'QRY023_TIMEOUT_PROBE|COMPLETED';\n",
              encoding="utf-8",
          )
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          set +e
          python Demos/00_Framework/Tools/run_demo.py \
            "$timeout_manifest" \
            --server localhost --auth sql --username sa \
            --sqlcmd Tests/Runtime/qry023_docker_sqlcmd_proxy.py \
