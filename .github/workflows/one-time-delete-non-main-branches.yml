name: One-time delete non-main branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-delete-non-main-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            const failures = [];
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              const ref = `heads/${branch.name}`;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Branch deletion failures:\n${failures.join('\n')}`);
            }

      - name: Remove this one-time workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/workflows/one-time-delete-non-main-branches.yml';
            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: 'main'
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: 'Remove one-time branch cleanup workflow',
              sha: current.data.sha,
              branch: 'main'
            });
