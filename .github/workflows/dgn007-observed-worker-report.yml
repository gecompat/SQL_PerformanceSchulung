name: DGN-007 Aufgenommener Workerreport

on:
  pull_request:
    paths:
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Documentation/Project_Planning/DGN_007_OBSERVED_WORKER_REPORT_REVIEW.md'
      - '.github/workflows/dgn007-observed-worker-report.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Documentation/Project_Planning/DGN_007_OBSERVED_WORKER_REPORT_REVIEW.md'
      - '.github/workflows/dgn007-observed-worker-report.yml'

permissions:
  contents: read

concurrency:
  group: dgn007-observed-worker-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observed-report:
    name: DGN-007 Empfang und tatsächliche Reportaufnahme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tatsächliche Aufnahme und vollständige Reportrecords prüfen
        run: python -I -S -B Tests/Static/test_dgn007_observed_worker_report.py
