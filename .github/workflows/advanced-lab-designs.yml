name: Advanced lab design contracts

on:
  pull_request:
    paths:
      - 'Documentation/Project_Planning/ADV_004_LAB_VP1_DESIGN.md'
      - 'Documentation/Project_Planning/ADV_005_LAB_VP2_DESIGN.md'
      - 'Documentation/Project_Planning/advanced_vp1_vp2_design.json'
      - 'Documentation/Project_Planning/ADVANCED_PERFORMANCE_BLOCK_PLAN.md'
      - 'Documentation/Project_Planning/CURRENT_EXECUTION_STATUS.md'
      - '.ai/BACKLOG.md'
      - 'Tests/Static/validate_adv_004_005_designs.py'
      - '.github/workflows/advanced-lab-designs.yml'
  push:
    branches: [main]
    paths:
      - 'Documentation/Project_Planning/ADV_004_LAB_VP1_DESIGN.md'
      - 'Documentation/Project_Planning/ADV_005_LAB_VP2_DESIGN.md'
      - 'Documentation/Project_Planning/advanced_vp1_vp2_design.json'
      - 'Documentation/Project_Planning/ADVANCED_PERFORMANCE_BLOCK_PLAN.md'
      - 'Documentation/Project_Planning/CURRENT_EXECUTION_STATUS.md'
      - '.ai/BACKLOG.md'
      - 'Tests/Static/validate_adv_004_005_designs.py'
      - '.github/workflows/advanced-lab-designs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-lab-designs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ADV-004 and ADV-005
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate design contracts
        run: python3 Tests/Static/validate_adv_004_005_designs.py
      - name: Run repository privacy scan
        run: python3 Tests/Static/validate_privacy_metadata.py .
