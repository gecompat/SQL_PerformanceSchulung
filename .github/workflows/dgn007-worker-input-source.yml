name: DGN-007 Vollständige Worker-Eingangsfolge

on:
  pull_request:
    paths:
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Documentation/Project_Planning/DGN_007_WORKER_INPUT_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-worker-input-source.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Documentation/Project_Planning/DGN_007_WORKER_INPUT_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-worker-input-source.yml'

permissions:
  contents: read

concurrency:
  group: dgn007-worker-input-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-input:
    name: DGN-007 Gebundene Eingangsfolge in eigenen I/O-Modellen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vollständige Phasenfolge und Quellenfit ohne native I/O prüfen
        run: python -I -S -B Tests/Static/test_dgn007_worker_input_source.py
