name: DGN-007 Verschachtelte Harnessquellen

on:
  pull_request:
    paths:
      - 'Tests/Tools/dgn007_harness_loader_source.py'
      - 'Tests/Tools/dgn007_proxy_loader_source.py'
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Tools/dgn007_import_probe_input.py'
      - 'Tests/Tools/dgn007_source_bundle.py'
      - 'Tests/Tools/dgn007_execution_edges.py'
      - 'Tests/Tools/dgn007_import_used_bytes_probe.py'
      - 'Tests/Static/test_dgn007_harness_loader_source.py'
      - 'Tests/Static/test_dgn007_proxy_loader_source.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_import_used_bytes_probe.py'
      - 'Tests/Runtime/run_dgn007_automated_setup.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - 'Demos/00_Framework/Tools/run_demo.py'
      - 'Demos/00_Framework/Tools/orchestrate_sessions.py'
      - 'Demos/00_Framework/Tools/sqlcmd_process.py'
      - 'Tests/Contracts/dgn007_capture_projection.py'
      - 'Tests/Contracts/dgn007_collector_transport.py'
      - 'Tests/Contracts/dgn007_prospective_acceptance.py'
      - 'Documentation/Project_Planning/DGN_007_IMPORT_USED_BYTES_PROBE_DESIGN.md'
      - 'Documentation/Project_Planning/DGN_007_HARNESS_LOADER_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-harness-loader-source.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Tools/dgn007_harness_loader_source.py'
      - 'Tests/Tools/dgn007_proxy_loader_source.py'
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Tools/dgn007_import_probe_input.py'
      - 'Tests/Tools/dgn007_source_bundle.py'
      - 'Tests/Tools/dgn007_execution_edges.py'
      - 'Tests/Tools/dgn007_import_used_bytes_probe.py'
      - 'Tests/Static/test_dgn007_harness_loader_source.py'
      - 'Tests/Static/test_dgn007_proxy_loader_source.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Tests/Static/test_dgn007_import_used_bytes_probe.py'
      - 'Tests/Runtime/run_dgn007_automated_setup.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - 'Demos/00_Framework/Tools/run_demo.py'
      - 'Demos/00_Framework/Tools/orchestrate_sessions.py'
      - 'Demos/00_Framework/Tools/sqlcmd_process.py'
      - 'Tests/Contracts/dgn007_capture_projection.py'
      - 'Tests/Contracts/dgn007_collector_transport.py'
      - 'Tests/Contracts/dgn007_prospective_acceptance.py'
      - 'Documentation/Project_Planning/DGN_007_IMPORT_USED_BYTES_PROBE_DESIGN.md'
      - 'Documentation/Project_Planning/DGN_007_HARNESS_LOADER_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-harness-loader-source.yml'

permissions:
  contents: read

concurrency:
  group: dgn007-harness-loader-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-loader:
    name: DGN-007 Eigene verschachtelte Harnessmodelle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Quellenfit, Importgateway und vollständige eigene Traces prüfen
        run: python -I -S -B Tests/Static/test_dgn007_harness_loader_source.py
      - name: Import-Only-Worker mit Fixtures und gebundenem DGN-Bundle prüfen
        run: python -I -S -B Tests/Static/test_dgn007_import_used_bytes_probe.py
