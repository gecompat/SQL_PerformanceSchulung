name: Cleanup W2-001 branch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-w2-001-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cleanup-w2-001-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/cleanup-w2-001-branch
          fetch-depth: 0
      - name: Delete merged and cleanup branches
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/agent/w2-001-example-classification >/dev/null 2>&1; then
            git push origin --delete agent/w2-001-example-classification
          fi
          git push origin --delete agent/cleanup-w2-001-branch
