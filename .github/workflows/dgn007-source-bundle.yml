permissions:
  contents: read

concurrency:
  group: dgn007-source-bundle-${{ github.workflow }}-${{ github.ref }}
  # Ausschließlich eigene temporäre Git-/Dateifixtures, keine SQL-Ressourcen.
  cancel-in-progress: true

jobs:
  source-bundle:
    name: DGN-007 Offline-Bundle-Gegenproben
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gebundene Kandidaten und Manipulationen prüfen
        run: python -B Tests/Static/test_dgn007_source_bundle.py
      - name: Gebundene Prozess- und Manifestkanten pruefen
        run: python -B Tests/Static/test_dgn007_execution_edges.py
      - name: Eingangsrahmung und Kontextmanipulationen prüfen
        run: python -B Tests/Static/test_dgn007_import_probe_input.py
