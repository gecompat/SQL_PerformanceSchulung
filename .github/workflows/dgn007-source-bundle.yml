permissions:
  contents: read

concurrency:
  group: dgn007-source-bundle-${{ github.workflow }}-${{ github.ref }}
  # Eigene Git-/Dateifixtures und feste synthetische Loaderbytes, keine SQL-Ressourcen.
  cancel-in-progress: true

jobs:
  source-bundle:
    name: DGN-007 Offline-Bundle-Gegenproben
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gebundene Kandidaten und Manipulationen prüfen
        run: python -B Tests/Static/test_dgn007_source_bundle.py
      - name: Gebundene Prozess- und Manifestkanten pruefen
        run: python -B Tests/Static/test_dgn007_execution_edges.py
      - name: Eingangsrahmung und Kontextmanipulationen prüfen
        run: python -B Tests/Static/test_dgn007_import_probe_input.py
      - name: Feste Memory-Loader-Fälle und Abschlussbindungen prüfen
        run: python -B Tests/Static/test_dgn007_memory_loader_fixture.py
      - name: Deklariertes Profil und isolierte Bootstrapmetadaten prüfen
        run: python -I -S -B Tests/Static/test_dgn007_import_runtime_profile.py
      - name: Skalare Profilbindung und gemeinsame Metadatengrenzen prüfen
        run: python -I -S -B Tests/Static/test_dgn007_import_profile_binding.py
      - name: Vollständige deklarative Formen und Größen des Entwurfs prüfen
        run: python -I -S -B Tests/Static/test_dgn007_compact_profile_sizing.py
      - name: Vollständige Stringpools und Größen des getrennten Entwurfs prüfen
        run: python -I -S -B Tests/Static/test_dgn007_pooled_profile_sizing.py
      - name: Begrenzte Stringpoolrahmen und eigene Digestdomains prüfen
        run: python -I -S -B Tests/Static/test_dgn007_pooled_profile_codec.py
      - name: Kombinierte Stringpoolmetadata und vollständige Rawbodybindung prüfen
        run: python -I -S -B Tests/Static/test_dgn007_pooled_combined_input.py
