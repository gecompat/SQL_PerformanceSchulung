name: Framework SQL matrix

on:
  pull_request:
    paths:
      - 'Demos/00_Framework/**'
      - 'Tests/Runtime/run_framework_sql_matrix.py'
      - 'Tests/Runtime/run_framework_sql_matrix_staged.py'
      - 'Tests/Runtime/framework_ownership.py'
      - 'Tests/Runtime/framework_inputs.py'
      - 'Tests/Runtime/cleanup_ownership.py'
      - 'Tests/Static/test_framework_ownership.py'
      - 'Tests/Static/test_framework_inputs.py'
      - 'Tests/Static/test_runtime_workflow_selector.py'
      - 'Tests/Static/select_runtime_workflow.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - 'Tests/Runtime/host_sqlcmd_target.py'
      - '.github/workflows/framework-sql-matrix.yml'
  push:
    branches:
      - main
    paths:
      - 'Demos/00_Framework/**'
      - 'Tests/Runtime/run_framework_sql_matrix.py'
      - 'Tests/Runtime/run_framework_sql_matrix_staged.py'
      - 'Tests/Runtime/framework_ownership.py'
      - 'Tests/Runtime/framework_inputs.py'
      - 'Tests/Runtime/cleanup_ownership.py'
      - 'Tests/Static/test_framework_ownership.py'
      - 'Tests/Static/test_framework_inputs.py'
      - 'Tests/Static/test_runtime_workflow_selector.py'
      - 'Tests/Static/select_runtime_workflow.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - 'Tests/Runtime/host_sqlcmd_target.py'
      - '.github/workflows/framework-sql-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-sql-matrix-${{ github.workflow }}-${{ github.ref }}
  # DEC-067: Laufende SQL-Runtime-Validierung bis zum Cleanup erhalten.
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_runtime: ${{ steps.select.outputs.run_runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python Tests/Static/select_runtime_workflow.py
          --workflow framework --event "$EVENT_NAME"
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  static:
    name: Static framework ownership oracles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python Tests/Static/test_framework_ownership.py
      - run: python Tests/Static/test_framework_inputs.py
      - run: python Tests/Static/test_runtime_workflow_selector.py

  runtime:
    name: SQL Server ${{ matrix.year }}
    needs: [static, changes]
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ${{ vars.SQLPERF_RUNTIME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2019
            major: 15
            compatibility: 150
            image: mcr.microsoft.com/mssql/server:2019-latest
          - year: 2022
            major: 16
            compatibility: 160
            image: mcr.microsoft.com/mssql/server:2022-latest
          - year: 2025
            major: 17
            compatibility: 170
            image: mcr.microsoft.com/mssql/server:2025-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start SQL Server container
        shell: bash
        run: |
          set -euo pipefail

          password="SqlP!${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}${{ matrix.major }}Aa"
          owner="fwk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.major }}"
          container="sqlperf-${owner}"

          echo "::add-mask::${password}"
          export SQLCMDPASSWORD="${password}" MSSQL_SA_PASSWORD="${password}"
          echo "SQLPERF_OWNER=${owner}" >> "$GITHUB_ENV"
          echo "SQLCMDPASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "SQLPERF_SQL_CONTAINER=${container}" >> "${GITHUB_ENV}"

          docker pull '${{ matrix.image }}'
          image_id="$(docker image inspect -f '{{.Id}}' '${{ matrix.image }}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SQLPERF_IMAGE_ID=${image_id}" >> "$GITHUB_ENV"
          docker run \
            --name "${container}" \
            --hostname "${container}" \
            --label "sqlperf.owner=${owner}" --cpus 2 --memory 2g \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD \
            -d \
            "$image_id"

          ready=0
          for attempt in $(seq 1 90); do
            if docker logs "${container}" 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              ready=1
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "${container}")" != 'true' ]; then
              docker logs "${container}" 2>&1 || true
              exit 1
            fi

            sleep 2
          done

          if [ "${ready}" != '1' ]; then
            docker logs "${container}" 2>&1 || true
            exit 1
          fi
          login_ready=0
          for attempt in $(seq 1 30); do
            if docker exec -e SQLCMDPASSWORD "${container}" sh -lc '
              if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then sqlcmd=/opt/mssql-tools18/bin/sqlcmd;
              elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then sqlcmd=/opt/mssql-tools/bin/sqlcmd;
              else exit 127; fi
              "$sqlcmd" -S localhost -U sa -C -Q "SET NOCOUNT ON; SELECT 1;"' >/dev/null 2>&1; then
              login_ready=1
              break
            fi
            sleep 2
          done
          if [ "${login_ready}" != '1' ]; then
            docker logs "${container}" 2>&1 || true
            exit 1
          fi

      - name: Run framework runtime matrix
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Tests/Runtime/docker_sqlcmd_proxy.py
          timeout --signal=TERM --kill-after=30s 1500s python Tests/Runtime/run_framework_sql_matrix_staged.py \
            --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}' \
            --compatibility-level '${{ matrix.compatibility }}' \
            2>&1 | tee "${RUNNER_TEMP}/framework-sql-${{ matrix.major }}.log"

      - name: Show SQL Server logs on failure
        if: failure()
        shell: bash
        run: docker logs "${SQLPERF_SQL_CONTAINER}" 2>&1 || true

      - name: Remove own container and verify absence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SQLPERF_SQL_CONTAINER:-}" ]; then exit 0; fi
          cid="$(docker ps -aq --no-trunc --filter "name=^/${SQLPERF_SQL_CONTAINER}$")"
          if [ -z "$cid" ]; then exit 0; fi
          test "$(docker inspect -f '{{index .Config.Labels "sqlperf.owner"}}' "$cid")" = "$SQLPERF_OWNER"
          test "$(docker inspect -f '{{.Image}}' "$cid")" = "$SQLPERF_IMAGE_ID"
          docker rm -f "$cid"
          test -z "$(docker ps -aq --no-trunc --filter "id=$cid")"
          test -z "$(docker ps -aq --no-trunc --filter "name=^/${SQLPERF_SQL_CONTAINER}$")"
          test -z "$(docker ps -aq --no-trunc --filter "label=sqlperf.owner=$SQLPERF_OWNER")"

      - name: Upload matrix diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-sql-${{ matrix.year }}-diagnostic
          path: ${{ runner.temp }}/framework-sql-${{ matrix.major }}.log
          if-no-files-found: warn
          retention-days: 3
