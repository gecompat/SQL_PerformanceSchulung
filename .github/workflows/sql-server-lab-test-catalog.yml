name: SQL Server Lab scenario contract

on:
  pull_request:
    paths:
      - 'Demos/**/manifest.json'
      - 'Scenarios/QRY-001/**'
      - 'Tests/Lab/**'
      - 'Tests/Static/validate_sql_server_lab_test_catalog.py'
      - 'Documentation/Architecture/SQL_SERVER_LAB_INTERACTIVE_SCENARIOS.md'
      - 'Documentation/Architecture/SQL_SERVER_LAB_TEST_AUTOMATION.md'
      - 'Documentation/Project_Planning/CURRENT_EXECUTION_STATUS.md'
      - 'Documentation/Project_Planning/LABINT_002_QRY_001_LOCAL_RESULT.md'
      - 'Documentation/Project_Planning/LABINT_001_SQL_SERVER_LAB_INTEGRATION_REVIEW.md'
      - 'Documentation/Project_Planning/LABINT_001_EXPECTATION_CORRECTION.md'
      - 'Documentation/Project_Planning/LABSCN_001_INTERACTIVE_SCENARIO_DECISION_REVIEW.md'
      - 'Documentation/README.md'
      - 'Infrastructure/README.md'
      - '.ai/BACKLOG.md'
      - '.ai/DECISIONS.md'
      - '.github/workflows/sql-server-lab-test-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'Demos/**/manifest.json'
      - 'Scenarios/QRY-001/**'
      - 'Tests/Lab/**'
      - 'Tests/Static/validate_sql_server_lab_test_catalog.py'
      - 'Documentation/Architecture/SQL_SERVER_LAB_INTERACTIVE_SCENARIOS.md'
      - 'Documentation/Architecture/SQL_SERVER_LAB_TEST_AUTOMATION.md'
      - 'Documentation/Project_Planning/CURRENT_EXECUTION_STATUS.md'
      - 'Documentation/Project_Planning/LABINT_002_QRY_001_LOCAL_RESULT.md'
      - 'Documentation/Project_Planning/LABINT_001_SQL_SERVER_LAB_INTEGRATION_REVIEW.md'
      - 'Documentation/Project_Planning/LABINT_001_EXPECTATION_CORRECTION.md'
      - 'Documentation/Project_Planning/LABSCN_001_INTERACTIVE_SCENARIO_DECISION_REVIEW.md'
      - 'Documentation/README.md'
      - 'Infrastructure/README.md'
      - '.ai/BACKLOG.md'
      - '.ai/DECISIONS.md'
      - '.github/workflows/sql-server-lab-test-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-server-lab-scenario-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interactive scenario and test catalog contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate interactive scenario and automated test catalog
        run: python3 Tests/Static/validate_sql_server_lab_test_catalog.py
      - name: Run repository privacy scan
        run: python3 Tests/Static/validate_privacy_metadata.py .
