name: Privacy and metadata scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Repository privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run scanner self-tests
        run: python3 Tests/Static/test_privacy_metadata_scanner.py

      - name: Scan repository
        run: python3 Tests/Static/validate_privacy_metadata.py .
