name: Curriculum and privacy validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Curriculum and repository privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate ADV-003 curriculum
        run: python3 Tests/Static/validate_adv_003_curriculum.py

      - name: Run privacy scanner self-tests
        run: python3 Tests/Static/test_privacy_metadata_scanner.py

      - name: Scan repository
        id: privacy_scan
        shell: bash
        run: |
          set +e
          python3 Tests/Static/validate_privacy_metadata.py . > "${RUNNER_TEMP}/privacy-report.txt" 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload privacy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-categories
          path: ${{ runner.temp }}/privacy-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce privacy result
        if: steps.privacy_scan.outputs.status != '0'
        run: |
          echo "Privacy scan reported categorized findings. Download the privacy-categories artifact; matched values are never included."
          exit 1
