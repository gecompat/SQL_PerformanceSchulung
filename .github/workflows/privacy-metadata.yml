name: Curriculum and privacy validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Curriculum and repository privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate ADV-003 curriculum
        run: python3 Tests/Static/validate_adv_003_curriculum.py

      - name: Run privacy scanner self-tests
        run: python3 Tests/Static/test_privacy_metadata_scanner.py

      - name: Scan repository
        run: python3 Tests/Static/validate_privacy_metadata.py .
