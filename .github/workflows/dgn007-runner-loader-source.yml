name: DGN-007 Vollständige Runnerquellen

on:
  pull_request:
    paths:
      - 'Tests/Tools/dgn007_runner_loader_source.py'
      - 'Tests/Tools/dgn007_harness_loader_source.py'
      - 'Tests/Tools/dgn007_proxy_loader_source.py'
      - 'Tests/Tools/dgn007_codefree_parents.py'
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_runner_loader_source.py'
      - 'Tests/Static/test_dgn007_harness_loader_source.py'
      - 'Tests/Static/test_dgn007_proxy_loader_source.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Documentation/Project_Planning/DGN_007_RUNNER_LOADER_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-runner-loader-source.yml'
  push:
    branches: [main]
    paths:
      - 'Tests/Tools/dgn007_runner_loader_source.py'
      - 'Tests/Tools/dgn007_harness_loader_source.py'
      - 'Tests/Tools/dgn007_proxy_loader_source.py'
      - 'Tests/Tools/dgn007_codefree_parents.py'
      - 'Tests/Tools/dgn007_worker_input_source.py'
      - 'Tests/Tools/dgn007_control_bootstrap_source.py'
      - 'Tests/Tools/dgn007_import_runtime_profile.py'
      - 'Tests/Static/test_dgn007_runner_loader_source.py'
      - 'Tests/Static/test_dgn007_harness_loader_source.py'
      - 'Tests/Static/test_dgn007_proxy_loader_source.py'
      - 'Tests/Static/test_dgn007_worker_input_source.py'
      - 'Tests/Static/test_dgn007_observed_worker_report.py'
      - 'Tests/Static/test_dgn007_worker_profile_source.py'
      - 'Tests/Static/test_dgn007_selected_observation.py'
      - 'Tests/Static/test_dgn007_selected_profile.py'
      - 'Documentation/Project_Planning/DGN_007_RUNNER_LOADER_SOURCE_REVIEW.md'
      - '.github/workflows/dgn007-runner-loader-source.yml'

permissions:
  contents: read

concurrency:
  group: dgn007-runner-loader-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-loader:
    name: DGN-007 Eigene vollständige Runnermodelle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Quellenfit, acht Sourceinvocations und zwei Parents prüfen
        run: python -I -S -B Tests/Static/test_dgn007_runner_loader_source.py
