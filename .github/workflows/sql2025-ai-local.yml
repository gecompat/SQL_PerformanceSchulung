# Each matrix job executes the deterministic QRY-014 through QRY-019 and DGN-008/009 and CON-010 result contract twice.
name: SQL Server 2025 AI local runtime

on:
  pull_request:
    paths:
      - 'Demos/09_AI_SQL_Server_2025/**'
      - 'Demos/00_Framework/Tools/**'
      - 'Tests/Static/validate_framework_contracts.py'
      - 'Tests/Static/test_sql2025_ai_local.py'
      - 'Tests/Static/idx011_benchmark_evidence.py'
      - 'Tests/Static/test_idx011_benchmark.py'
      - 'Tests/Static/dgn010_window_evidence.py'
      - 'Tests/Static/dgn010_benchmark_evidence.py'
      - 'Tests/Static/test_dgn010_benchmark.py'
      - 'Tests/Static/dgn010_cost_evidence.py'
      - 'Tests/Static/test_dgn010_cost_evidence.py'
      - 'Tests/Static/dgn010_cost_inputs.py'
      - 'Tests/Static/test_dgn010_cost_inputs.py'
      - 'Tests/Static/test_dgn010_cost_profile.py'
      - 'Tests/Static/test_dgn010_cost_consumer.py'
      - 'Tests/Runtime/run_dgn010_cost_profile.py'
      - 'Tests/Static/Fixtures/dgn010/**'
      - 'Tests/Static/test_dgn010_profile.py'
      - 'Tests/Static/select_runtime_workflow.py'
      - 'Tests/Runtime/run_dgn010_profile.py'
      - 'Tests/Runtime/dgn010_marker_controls.py'
      - 'Tests/Runtime/run_dgn010_marker_controls.py'
      - 'Tests/Static/test_dgn010_marker_controls.py'
      - 'Tests/Runtime/dgn010_docker_sqlcmd_proxy.py'
      - 'Tests/Static/test_idx011_profile.py'
      - 'Tests/Static/test_idx011_plan.py'
      - 'Tests/Static/test_idx012_profile.py'
      - 'Tests/Static/test_idx012_dml_boundary.py'
      - 'Tests/Static/vector_client_layout_evidence.py'
      - 'Tests/Static/test_vector_client_layout_evidence.py'
      - 'Tests/Static/Fixtures/vector_client_layout/**'
      - 'Tests/Static/idx012_dml_role_evidence.py'
      - 'Tests/Static/test_idx012_dml_role_evidence.py'
      - 'Tests/Static/Fixtures/idx012/**'
      - 'Tests/Static/test_idx012_lifecycle.py'
      - 'Tests/Static/test_idx012_storage.py'
      - 'Tests/Static/test_idx012_costs.py'
      - 'Tests/Static/test_res008_profile.py'
      - 'Tests/Static/test_res008_plans.py'
      - 'Tests/Static/test_res008_measurement.py'
      - 'Tests/Runtime/run_res008_profile.py'
      - 'Tests/Runtime/res008_docker_sqlcmd_proxy.py'
      - 'Tests/Static/test_res008_proxy.py'
      - 'Tests/Static/test_res008_summary.py'
      - 'Tests/Static/test_res008_summary_cli.py'
      - 'Tests/Runtime/run_sql2025_ai_local.py'
      - 'Tests/Runtime/con010_controls.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/host_sqlcmd_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - '.github/workflows/sql2025-ai-local.yml'
  push:
    branches: [main]
    paths:
      - 'Demos/09_AI_SQL_Server_2025/**'
      - 'Demos/00_Framework/Tools/**'
      - 'Tests/Static/validate_framework_contracts.py'
      - 'Tests/Static/test_sql2025_ai_local.py'
      - 'Tests/Static/idx011_benchmark_evidence.py'
      - 'Tests/Static/test_idx011_benchmark.py'
      - 'Tests/Static/dgn010_window_evidence.py'
      - 'Tests/Static/dgn010_benchmark_evidence.py'
      - 'Tests/Static/test_dgn010_benchmark.py'
      - 'Tests/Static/dgn010_cost_evidence.py'
      - 'Tests/Static/test_dgn010_cost_evidence.py'
      - 'Tests/Static/dgn010_cost_inputs.py'
      - 'Tests/Static/test_dgn010_cost_inputs.py'
      - 'Tests/Static/test_dgn010_cost_profile.py'
      - 'Tests/Static/test_dgn010_cost_consumer.py'
      - 'Tests/Runtime/run_dgn010_cost_profile.py'
      - 'Tests/Static/Fixtures/dgn010/**'
      - 'Tests/Static/test_dgn010_profile.py'
      - 'Tests/Static/select_runtime_workflow.py'
      - 'Tests/Runtime/run_dgn010_profile.py'
      - 'Tests/Runtime/dgn010_marker_controls.py'
      - 'Tests/Runtime/run_dgn010_marker_controls.py'
      - 'Tests/Static/test_dgn010_marker_controls.py'
      - 'Tests/Runtime/dgn010_docker_sqlcmd_proxy.py'
      - 'Tests/Static/test_idx011_profile.py'
      - 'Tests/Static/test_idx011_plan.py'
      - 'Tests/Static/test_idx012_profile.py'
      - 'Tests/Static/test_idx012_dml_boundary.py'
      - 'Tests/Static/vector_client_layout_evidence.py'
      - 'Tests/Static/test_vector_client_layout_evidence.py'
      - 'Tests/Static/Fixtures/vector_client_layout/**'
      - 'Tests/Static/idx012_dml_role_evidence.py'
      - 'Tests/Static/test_idx012_dml_role_evidence.py'
      - 'Tests/Static/Fixtures/idx012/**'
      - 'Tests/Static/test_idx012_lifecycle.py'
      - 'Tests/Static/test_idx012_storage.py'
      - 'Tests/Static/test_idx012_costs.py'
      - 'Tests/Static/test_res008_profile.py'
      - 'Tests/Static/test_res008_plans.py'
      - 'Tests/Static/test_res008_measurement.py'
      - 'Tests/Runtime/run_res008_profile.py'
      - 'Tests/Runtime/res008_docker_sqlcmd_proxy.py'
      - 'Tests/Static/test_res008_proxy.py'
      - 'Tests/Static/test_res008_summary.py'
      - 'Tests/Static/test_res008_summary_cli.py'
      - 'Tests/Runtime/run_sql2025_ai_local.py'
      - 'Tests/Runtime/con010_controls.py'
      - 'Tests/Runtime/execution_target.py'
      - 'Tests/Runtime/host_sqlcmd_target.py'
      - 'Tests/Runtime/docker_sqlcmd_proxy.py'
      - '.github/workflows/sql2025-ai-local.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql2025-ai-local-${{ github.workflow }}-${{ github.ref }}
  # DEC-067: Laufende SQL-Runtime-Validierung bis zum Cleanup erhalten.
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_runtime: ${{ steps.select.outputs.run_runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python Tests/Static/select_runtime_workflow.py
          --workflow sql2025-ai-local --event "$EVENT_NAME"
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  static:
    name: Static QRY-014 through QRY-019 and DGN-008/009 and CON-010 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate QRY-014 through QRY-019 and DGN-008/009 and CON-010 contracts
        run: python Tests/Static/validate_framework_contracts.py
      - name: Validate compatibility and cleanup ordering
        run: python Tests/Static/test_sql2025_ai_local.py
      - name: Validate bounded IDX-011 benchmark preparation
        run: python Tests/Static/test_idx011_benchmark.py
      - name: Validate bounded DGN-010 benchmark preparation
        run: python Tests/Static/test_dgn010_benchmark.py
      - name: Validate pure DGN-010 cost records
        run: python Tests/Static/test_dgn010_cost_evidence.py
      - name: Validate fixed DGN-010 cost SQL inputs
        run: python Tests/Static/test_dgn010_cost_inputs.py
      - name: Validate bounded DGN-010 cost controller
        run: python Tests/Static/test_dgn010_cost_profile.py
      - name: Validate bounded DGN-010 cost CI consumer
        run: python Tests/Static/test_dgn010_cost_consumer.py
      - name: Validate bounded DGN-010 public controller
        run: python Tests/Static/test_dgn010_profile.py
      - name: Validate bounded DGN-010 marker controller
        run: python Tests/Static/test_dgn010_marker_controls.py
      - name: Validate bounded IDX-011 controller and recovery
        run: python Tests/Static/test_idx011_profile.py
      - name: Validate bounded representative IDX-011 plan measurements
        run: python Tests/Static/test_idx011_plan.py
      - name: Validate bounded IDX-012 DML and recovery preparation
        run: |
          python Tests/Static/test_idx012_profile.py
          python Tests/Static/test_idx012_dml_boundary.py
          python Tests/Static/test_idx012_lifecycle.py
          python Tests/Static/test_idx012_storage.py
          python Tests/Static/test_idx012_costs.py
      - name: Validate fixed source-only vector client layout
        env:
          PYTHONPATH: Tests/Static
        run: |
          python Tests/Static/test_vector_client_layout_evidence.py
          python -O -m unittest \
            test_vector_client_layout_evidence.LayoutTests.test_full_asset_sha_bootstrap_pins_and_null_bool_metadata \
            test_vector_client_layout_evidence.LayoutTests.test_fixed_historical_binding_does_not_accept_synthetic_metadata_as_actual \
            test_vector_client_layout_evidence.LayoutTests.test_contract_claim_count_origin_and_raw_extra_drift_are_rejected \
            test_vector_client_layout_evidence.LayoutTests.test_plain_types_duplicate_json_and_null_shapes_are_rejected
      - name: Validate pure IDX-012 DML and role records
        env:
          PYTHONPATH: Tests/Static
        run: |
          python Tests/Static/test_idx012_dml_role_evidence.py
          python -O -m unittest \
            test_idx012_dml_role_evidence.RecordTests.test_missing_extra_schema_nonbuiltin_and_source_binding_fail_closed \
            test_idx012_dml_role_evidence.RecordTests.test_principal_audit_permission_tuples_revocation_and_restore \
            test_idx012_dml_role_evidence.RecordTests.test_missing_capture_cannot_be_replaced_by_flags_or_fake_ends \
            test_idx012_dml_role_evidence.RecordTests.test_rebound_contract_claim_count_extra_raw_and_input_pin_drift
      - name: Validate source-only CON-010 pool producer and protected cleanup deltas
        env:
          PYTHONPATH: Tests/Static
        run: |
          python Tests/Static/test_con010_pool_profile.py
          python -O -m unittest \
            test_con010_pool_profile.ProducerTests.test_supported_container_id_case_full_ps_and_immediate_rm_argv \
            test_con010_pool_profile.ProducerTests.test_mutative_remove_missing_end_is_sticky_and_no_second_remove_or_sql \
            test_con010_pool_profile.ProducerTests.test_recorded_unknown_wave_stop_cannot_admit_native_candidate \
            test_con010_pool_profile.ProducerTests.test_actual_namespace_cleanup_preserves_full_inspect_and_two_absence_outputs
      - name: Validate bounded RES-008 consumer and evidence
        run: |
          python Tests/Static/test_res008_profile.py
          python Tests/Static/test_res008_plans.py
          python Tests/Static/test_res008_measurement.py
          python Tests/Static/test_res008_proxy.py
          python Tests/Static/test_res008_summary.py
          python Tests/Static/test_res008_summary_cli.py

  runtime:
    name: SQL Server ${{ matrix.year }} / CL ${{ matrix.compatibility_level }}
    needs: [static, changes]
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ${{ vars.SQLPERF_RUNTIME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2019
            major: 15
            compatibility_level: 150
            image: mcr.microsoft.com/mssql/server:2019-latest
          - year: 2022
            major: 16
            compatibility_level: 160
            image: mcr.microsoft.com/mssql/server:2022-latest
          - year: 2025
            major: 17
            compatibility_level: 170
            image: mcr.microsoft.com/mssql/server:2025-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Start disposable SQL Server container
        shell: bash
        run: |
          set -euo pipefail
          random_hex=$(openssl rand -hex 20)
          password="SqlP!${random_hex}"
          container="sqlperf-ai-local-${{ matrix.major }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::${password}"
          echo "SQLCMDPASSWORD=${password}" >> "${GITHUB_ENV}"
          echo "SQLPERF_SQL_CONTAINER=${container}" >> "${GITHUB_ENV}"
          docker pull '${{ matrix.image }}'
          export MSSQL_SA_PASSWORD="${password}"
          docker run --name "${container}" --hostname "${container}" --label sqlperf.owner=ai-local-ci --cpus 4 --memory 6g \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -d '${{ matrix.image }}'
          for attempt in $(seq 1 90); do
            if docker logs "${container}" 2>&1 | grep -q 'SQL Server is now ready for client connections'; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "${container}")" != 'true' ]; then echo 'AI_LOCAL|FAIL_CONTAINER_START'; exit 1; fi
            sleep 2
          done
          echo 'AI_LOCAL|FAIL_START_TIMEOUT'
          exit 1
      - name: Verify SQL login readiness
        shell: bash
        run: |
          set -euo pipefail
          login_ready=0
          for attempt in $(seq 1 30); do
            if docker exec -e SQLCMDPASSWORD "${SQLPERF_SQL_CONTAINER}" sh -lc '
              if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then sqlcmd=/opt/mssql-tools18/bin/sqlcmd;
              elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then sqlcmd=/opt/mssql-tools/bin/sqlcmd;
              else exit 127; fi
              "$sqlcmd" -S localhost -U sa -C -Q "SET NOCOUNT ON; SELECT 1;"' >/dev/null 2>&1; then
              login_ready=1
              break
            fi
            sleep 2
          done
          if [ "${login_ready}" -eq 1 ]; then exit 0; fi
          echo 'AI_LOCAL|FAIL_SQL_LOGIN_TIMEOUT'
          exit 1
      - name: Verify two lifecycles, result contracts and ownership negatives
        shell: bash
        run: |
          python Tests/Runtime/run_sql2025_ai_local.py \
            --target docker --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}'
      - name: Verify bounded RES-008 public lifecycles and setup recovery
        shell: bash
        run: |
          python Tests/Runtime/run_res008_profile.py \
            --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}'
      - name: Verify bounded DGN-010 SELECT and DML lifecycles and setup recovery
        shell: bash
        run: |
          python Tests/Runtime/run_dgn010_profile.py \
            --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}'
      - name: Verify bounded DGN-010 cost lifecycles and setup recovery
        shell: bash
        run: |
          python Tests/Runtime/run_dgn010_cost_profile.py \
            --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}'
      - name: Verify complete DGN-010 ownership marker controls
        shell: bash
        run: |
          python Tests/Runtime/run_dgn010_marker_controls.py \
            --container "${SQLPERF_SQL_CONTAINER}" \
            --expected-major '${{ matrix.major }}'
      - name: Remove SQL Server container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "${SQLPERF_SQL_CONTAINER}" >/dev/null 2>&1; then
            test "$(docker inspect -f '{{index .Config.Labels "sqlperf.owner"}}' "${SQLPERF_SQL_CONTAINER}")" = ai-local-ci
            docker rm -f "${SQLPERF_SQL_CONTAINER}" >/dev/null
          fi
          if docker container inspect "${SQLPERF_SQL_CONTAINER}" >/dev/null 2>&1; then exit 1; fi
          echo 'AI_LOCAL_CLEANUP|OWN_CONTAINER_ABSENT|PASS'
